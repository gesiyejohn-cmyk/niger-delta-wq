name: Validate integrated geophysics upgrade
on:
  push:
    branches: [ndwq-integrated-geophysics-upgrade, ndwq-desktop-build-integration, ndwq-coordinate-system-upgrade]
  workflow_dispatch:
concurrency:
  group: ndwq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          node upgrade/scripts/integrate-ert-tomogram.mjs
          test -f source/niger-delta-wq/src/pages/GeophysicsPage.jsx
      - name: Install dependencies
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm install --no-save fake-indexeddb
      - name: Run scientific and geophysics tests
        working-directory: source/niger-delta-wq
        run: npm test
      - name: Build web application
        working-directory: source/niger-delta-wq
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-web
          path: source/niger-delta-wq/dist
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: web-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          node upgrade/scripts/integrate-ert-tomogram.mjs
      - name: Install dependencies and build
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          node -e "const fs=require('fs'); const p='capacitor.config.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.appId='com.nigerdeltawq.mobile.upgradefix3'; c.appName='Niger Delta WQ Upgrade Fix 3'; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\\n');"
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: source/niger-delta-wq/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: false
          script: |
            set -euo pipefail
            APK=source/niger-delta-wq/android/app/build/outputs/apk/debug/app-debug.apk
            AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -perm -u+x | sort -V | tail -n 1)"
            if [ -z "$AAPT2" ]; then
              echo "Android build-tools aapt2 executable was not found."
              find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name 'aapt*' -print
              exit 1
            fi
            BADGING="$("$AAPT2" dump badging "$APK")"
            APP_ID="$(echo "$BADGING" | grep "^package: name=" | head -n 1 | cut -d "'" -f 2)"
            LAUNCHER_ACTIVITY="$(echo "$BADGING" | grep "^launchable-activity: name=" | head -n 1 | cut -d "'" -f 2)"
            echo "$BADGING"
            test -n "$APP_ID"
            test -n "$LAUNCHER_ACTIVITY"
            echo "APK application ID: $APP_ID"
            echo "APK launcher activity: $LAUNCHER_ACTIVITY"
            adb install "$APK"
            adb shell am start -n "$APP_ID/$LAUNCHER_ACTIVITY"
            APP_PID=""
            RESUMED_ACTIVITY=""
            for attempt in $(seq 1 30); do
              APP_PID="$(adb shell pidof "$APP_ID" | tr -d '\r' || true)"
              RESUMED_ACTIVITY="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F "$APP_ID" | tail -n 1 || true)"
              if [ -n "$APP_PID" ] && [ -n "$RESUMED_ACTIVITY" ]; then
                break
              fi
              sleep 1
            done
            if [ -z "$APP_PID" ] || [ -z "$RESUMED_ACTIVITY" ]; then
              echo "Android launch smoke-test failed: app process or resumed launcher activity not observed."
              adb shell dumpsys activity activities | tail -n 100
              adb logcat -d -t 500 | tail -n 200
              exit 1
            fi
            echo "Android app process: $APP_PID"
            echo "Android resumed activity: $RESUMED_ACTIVITY"
      - uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-android-apk-fix4
          path: source/niger-delta-wq/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  windows-desktop:
    runs-on: windows-latest
    needs: web-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply upgrade overlay
        shell: pwsh
        run: |
          Expand-Archive -Path NDWQ-Source-Compact.zip -DestinationPath source
          Copy-Item -Path upgrade/src/* -Destination source/niger-delta-wq/src/ -Recurse -Force
          Copy-Item -Path upgrade/tests/* -Destination source/niger-delta-wq/tests/ -Recurse -Force
          node upgrade/scripts/integrate-ert-tomogram.mjs
      - name: Install dependencies and build desktop installer
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          npx electron-builder --win nsis
      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-windows-desktop
          path: source/niger-delta-wq/release/*.exe
          if-no-files-found: error
          retention-days: 14
