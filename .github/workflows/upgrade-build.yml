name: Validate integrated geophysics upgrade
# Re-run full cross-platform validation against the current integrated branch head.
on:
  push:
    branches: [ndwq-integrated-geophysics-upgrade, ndwq-desktop-build-integration, ndwq-coordinate-system-upgrade]
  workflow_dispatch:
concurrency:
  group: ndwq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          node upgrade/scripts/integrate-ert-tomogram.mjs
          test -f source/niger-delta-wq/src/pages/GeophysicsPage.jsx
      - name: Install dependencies
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm install --no-save fake-indexeddb
      - name: Run scientific and geophysics tests
        working-directory: source/niger-delta-wq
        run: npm test
      - name: Build web application
        working-directory: source/niger-delta-wq
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ndwq-integrated-web
          path: source/niger-delta-wq/dist
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: web-and-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Enable Android emulator hardware acceleration
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "Runner user still cannot access /dev/kvm after permission setup."
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm
          echo "KVM access is available to the Android emulator."
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android emulator and API 35 system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager is missing: $SDKMANAGER"
            exit 1
          fi
          "$SDKMANAGER" --install "platform-tools" "emulator" "system-images;android-35;default;x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo "Android emulator, platform tools, AVD manager and API 35 image are installed."
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          node upgrade/scripts/integrate-ert-tomogram.mjs
      - name: Install dependencies and build
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8")); const p=JSON.parse(fs.readFileSync("package.json","utf8")); const id=c.appId || p.capacitor?.appId || null; const name=c.appName || p.capacitor?.appName || null; if(id!=="com.nigerdeltawq.mobile") throw new Error("Unexpected source Android application ID: "+id); if(name!=="Niger Delta WQ") throw new Error("Unexpected source Android application name: "+name); console.log("::notice::Verified source Android application ID: "+id); console.log("::notice::Verified source Android application name: "+name);'
          # Build and smoke-test the source package identity on a clean CI emulator.
          # This remains a debug-signed test APK, not an approved update for user devices.
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: source/niger-delta-wq/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Record Android APK identity and signing certificate
        working-directory: source/niger-delta-wq/android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          META="app/build/outputs/apk/debug/ndwq-android-build-metadata.txt"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -s "$APK"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          {
            echo "NDWQ Android debug build identity"
            echo "Application ID: com.nigerdeltawq.mobile"
            echo "Application label: Niger Delta WQ"
            echo
            echo "APK SHA-256:"
            sha256sum "$APK"
            echo
            echo "Package metadata:"
            "$AAPT" dump badging "$APK" | grep -E "^(package:|application-label:|launchable-activity:)"
            echo
            echo "APK signing certificate (debug build only):"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          } | tee "$META"
      - name: Boot Android emulator and launch original-identity APK
        run: bash upgrade/scripts/android-emulator-boot-and-smoke-test.sh
      - name: Build isolated side-by-side Android preview APK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_DIR="source/niger-delta-wq/android"
          ARTIFACT_DIR="$ANDROID_DIR/ndwq-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          cp "$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk" "$ARTIFACT_DIR/ndwq-original-debug.apk"
          cp "$ANDROID_DIR/app/build/outputs/apk/debug/ndwq-android-build-metadata.txt" "$ARTIFACT_DIR/ndwq-original-build-metadata.txt"
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("source/niger-delta-wq/android/app/build.gradle")
          source = gradle.read_text()
          marker = "defaultConfig {"
          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one defaultConfig block; refusing unsafe Gradle edit.")
          if "applicationIdSuffix" in source:
              raise SystemExit("An applicationIdSuffix already exists; refusing to stack package suffixes.")
          gradle.write_text(source.replace(marker, marker + '\n        applicationIdSuffix ".preview2"', 1))
          PY
          chmod +x "$ANDROID_DIR/gradlew"
          (cd "$ANDROID_DIR" && ./gradlew clean assembleDebug)
          PREVIEW_APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -s "$PREVIEW_APK"
          PREVIEW_ID="$("$AAPT" dump badging "$PREVIEW_APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PREVIEW_ID" = "com.nigerdeltawq.mobile.preview2"
          cp "$PREVIEW_APK" "$ARTIFACT_DIR/ndwq-side-by-side-preview-debug.apk"
          {
            echo "NDWQ side-by-side Android preview build"
            echo "Application ID: $PREVIEW_ID"
            echo "Application label: Niger Delta WQ"
            echo "APK SHA-256:"
            sha256sum "$ARTIFACT_DIR/ndwq-side-by-side-preview-debug.apk"
            echo
            echo "APK signing certificate:"
            "$APKSIGNER" verify --verbose --print-certs "$ARTIFACT_DIR/ndwq-side-by-side-preview-debug.apk"
          } | tee "$ARTIFACT_DIR/ndwq-preview-build-metadata.txt"
          NDWQ_ANDROID_APK="$ARTIFACT_DIR/ndwq-side-by-side-preview-debug.apk" bash upgrade/scripts/android-emulator-boot-and-smoke-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ndwq-integrated-android-debug-apk
          path: |
            source/niger-delta-wq/android/ndwq-artifacts/*.apk
            source/niger-delta-wq/android/ndwq-artifacts/*.txt
          retention-days: 14
  windows-desktop:
    runs-on: windows-latest
    needs: web-and-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Extract and apply upgrade overlay
        shell: pwsh
        run: |
          Expand-Archive -Path NDWQ-Source-Compact.zip -DestinationPath source
          Copy-Item -Path upgrade/src/* -Destination source/niger-delta-wq/src/ -Recurse -Force
          Copy-Item -Path upgrade/tests/* -Destination source/niger-delta-wq/tests/ -Recurse -Force
          node upgrade/scripts/integrate-ert-tomogram.mjs
      - name: Install dependencies and build desktop installer
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          npx electron-builder --win nsis --publish never
      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ndwq-integrated-windows-desktop
          path: source/niger-delta-wq/release/*.exe
          if-no-files-found: error
          retention-days: 14
