name: Validate integrated geophysics upgrade
on:
  push:
    branches: [ndwq-integrated-geophysics-upgrade, ndwq-desktop-build-integration, ndwq-coordinate-system-upgrade]
  workflow_dispatch:
concurrency:
  group: ndwq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Android emulator hardware acceleration
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "Runner user still cannot access /dev/kvm after permission setup."
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm
          echo "KVM access is available to the Android emulator."
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          node upgrade/scripts/integrate-ert-tomogram.mjs
          test -f source/niger-delta-wq/src/pages/GeophysicsPage.jsx
      - name: Install dependencies
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm install --no-save fake-indexeddb
      - name: Run scientific and geophysics tests
        working-directory: source/niger-delta-wq
        run: npm test
      - name: Build web application
        working-directory: source/niger-delta-wq
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-web
          path: source/niger-delta-wq/dist
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: web-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable Android emulator hardware acceleration
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "Runner user still cannot access /dev/kvm after permission setup."
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm
          echo "KVM access is available to the Android emulator."
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android emulator and API 35 system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager is missing: $SDKMANAGER"
            exit 1
          fi
          "$SDKMANAGER" --install "platform-tools" "emulator" "system-images;android-35;default;x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo "Android emulator, platform tools, AVD manager and API 35 image are installed."
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          node upgrade/scripts/integrate-ert-tomogram.mjs
      - name: Install dependencies and build
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          node -e "const fs=require('fs'); const p='capacitor.config.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.appId='com.nigerdeltawq.mobile.upgradefix3'; c.appName='Niger Delta WQ Upgrade Fix 3'; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\\n');"
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: source/niger-delta-wq/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Boot Android emulator and launch APK
        run: bash upgrade/scripts/android-emulator-boot-and-smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-android-apk-fix4
          path: source/niger-delta-wq/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  windows-desktop:
    runs-on: windows-latest
    needs: web-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply upgrade overlay
        shell: pwsh
        run: |
          Expand-Archive -Path NDWQ-Source-Compact.zip -DestinationPath source
          Copy-Item -Path upgrade/src/* -Destination source/niger-delta-wq/src/ -Recurse -Force
          Copy-Item -Path upgrade/tests/* -Destination source/niger-delta-wq/tests/ -Recurse -Force
          node upgrade/scripts/integrate-ert-tomogram.mjs
      - name: Install dependencies and build desktop installer
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          npx electron-builder --win nsis --publish never
      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-windows-desktop
          path: source/niger-delta-wq/release/*.exe
          if-no-files-found: error
          retention-days: 14
