name: Validate integrated geophysics upgrade
on:
  push:
    branches: [ndwq-integrated-geophysics-upgrade, ndwq-desktop-build-integration, ndwq-coordinate-system-upgrade]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          node upgrade/scripts/integrate-ert-tomogram.mjs
          test -f source/niger-delta-wq/src/pages/GeophysicsPage.jsx
      - name: Install dependencies
        working-directory: source/niger-delta-wq
        run: npm install
      - name: Run scientific and geophysics tests
        working-directory: source/niger-delta-wq
        run: npm test
      - name: Build web application
        working-directory: source/niger-delta-wq
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-web
          path: source/niger-delta-wq/dist
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    needs: web-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          node upgrade/scripts/integrate-ert-tomogram.mjs
      - name: Install dependencies and build
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          node -e "const fs=require('fs'); const p='capacitor.config.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.appId='com.nigerdeltawq.mobile.upgradefix3'; c.appName='Niger Delta WQ Upgrade Fix 3'; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\\n');"
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: source/niger-delta-wq/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-android-apk-fix3
          path: source/niger-delta-wq/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  windows-desktop:
    runs-on: windows-latest
    needs: web-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply upgrade overlay
        shell: pwsh
        run: |
          Expand-Archive -Path NDWQ-Source-Compact.zip -DestinationPath source
          Copy-Item -Path upgrade/src/* -Destination source/niger-delta-wq/src/ -Recurse -Force
          Copy-Item -Path upgrade/tests/* -Destination source/niger-delta-wq/tests/ -Recurse -Force
          node upgrade/scripts/integrate-ert-tomogram.mjs
      - name: Install dependencies and build desktop installer
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          npx electron-builder --win nsis
      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-windows-desktop
          path: source/niger-delta-wq/release/*.exe
          if-no-files-found: error
          retention-days: 14
