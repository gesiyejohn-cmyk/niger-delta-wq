name: Validate integrated geophysics upgrade
on:
  push:
    branches:
      - ndwq-integrated-geophysics-upgrade
      - feature/external-reference-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
          test -f source/niger-delta-wq/src/pages/GeophysicsPage.jsx
      - name: Install dependencies
        working-directory: source/niger-delta-wq
        run: npm install
      - name: Run scientific and geophysics tests
        working-directory: source/niger-delta-wq
        run: npm test
      - name: Build web application
        working-directory: source/niger-delta-wq
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-web
          path: source/niger-delta-wq/dist
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    needs: web-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Extract and apply upgrade overlay
        run: |
          unzip -q NDWQ-Source-Compact.zip -d source
          cp -R upgrade/src/. source/niger-delta-wq/src/
          cp -R upgrade/tests/. source/niger-delta-wq/tests/
      - name: Install dependencies and build
        working-directory: source/niger-delta-wq
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: source/niger-delta-wq/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ndwq-integrated-android-apk
          path: source/niger-delta-wq/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
